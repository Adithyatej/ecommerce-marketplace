<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace Storefront - Customer Hub</title>
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-dashboard-role="user">
<!-- Header with user profile and cart -->
<header class="marketplace-header">
    <a class="brand" href="user-home.html">
        <div class="brand-icon">M</div>
        <div>
            <span class="brand-name">OmniMarket</span>
            <span class="brand-badge">Buyer Portal</span>
        </div>
    </a>

    <div class="nav-links">
        <a class="user-badge-pill" href="user-profile.html">
            <span>👋 Welcome, <strong id="current-user-display">Customer</strong></span>
            <span class="jwt-badge" id="jwt-status-indicator">JWT ACTIVE</span>
        </a>

        <button class="btn btn-secondary btn-sm" id="cart-btn" style="position: relative;">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>

        <button class="btn btn-danger btn-sm" id="logout-btn">
            Logout
        </button>
    </div>
</header>

<main class="dashboard-container">
    <!-- Top Toolbar with Search & Categories -->
    <div class="storefront-toolbar">
        <div class="search-input-wrap">
            <input type="text" id="product-search-input" placeholder="Search across thousands of multi-vendor items..." />
        </div>

        <div class="category-pills">
            <button class="pill-btn active" data-category="all">All Items</button>
            <button class="pill-btn" data-category="electronics">Electronics</button>
            <button class="pill-btn" data-category="home-living">Home and Living</button>
            <button class="pill-btn" data-category="beauty-health">Beauty and Health</button>
            <button class="pill-btn" data-category="sports-fitness">Sports and Fitness</button>
        </div>
    </div>

    <!-- Section Title -->
    <div class="dashboard-topbar">
        <div class="dashboard-title-area">
            <h1>Explore Multi-Vendor Deals</h1>
            <p>Browse authentic listings directly from verified independent merchants.</p>
        </div>
    </div>

    <!-- Products Showcase Grid — populated dynamically by user-home.js from
         GET /api/productsList/view/products, not hardcoded here anymore -->
    <div class="products-grid" id="products-grid">
        <p class="empty-state" id="no-products-message" style="display: none;">
            Loading products…
        </p>
    </div>

    <div class="pagination" id="pagination"></div>
</main>

<script src="../js/app.js"></script>
<script src="../js/user-home.js"></script>
</body>
</html>
