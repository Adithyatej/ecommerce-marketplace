<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Registration - OmniMarket</title>
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
    <header class="marketplace-header">
        <a class="brand" href="index.html">
            <div class="brand-icon">M</div>
            <div>
                <span class="brand-name">OmniMarket</span>
                <span class="brand-badge">User Portal</span>
            </div>
        </a>
        <nav class="nav-links">
            <a class="nav-link" href="login.html">Sign In</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="card">
            <a class="back-link" href="register.html">← Back to Role Selection</a>
            
            <div class="card-header" style="text-align: left; margin-bottom: 1.5rem;">
                <h1>Create Customer Account</h1>
                <p>Register as a buyer to shop across hundreds of independent vendors.</p>
            </div>

            <!-- Registration sends JSON payload via app.js -->
            <form id="user-register-form" 
                  data-register-role="user" 
                  data-endpoint="http://localhost:8080/api/customer-auth/register">



                
                <div class="form-group">
                    <label for="reg-name">Full Name <span class="required">*</span></label>
                    <input id="reg-name" name="name" type="text" placeholder="John Doe" required autocomplete="name" />
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address <span class="required">*</span></label>
                    <input id="reg-email" name="email" type="email" placeholder="john.doe@example.com" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="reg-password">Password <span class="required">*</span></label>
                    <input id="reg-password" name="password" type="password" placeholder="Min. 8 characters" minlength="8" required autocomplete="new-password" />
                    <span class="input-hint">Must be at least 8 characters long</span>
                </div>

                <div class="form-group">
                    <label for="reg-phone">Phone Number <span class="required">*</span></label>
                    <input id="reg-phone" name="phoneNumber" type="tel" placeholder="+1234567890" pattern="^\+?[0-9]{10,15}$" title="Enter 10 to 15 digits, optionally starting with +" required autocomplete="tel" />
                    <span class="input-hint">10 to 15 digits, optionally starting with +</span>
                </div>

                <div class="message" aria-live="polite"></div>

                <button class="btn btn-primary btn-block" type="submit">Complete Customer Registration</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="user-login.html">Sign In as Customer</a></p>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/user-register.js"></script>
</body>
</html>
